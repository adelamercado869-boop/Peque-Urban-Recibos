<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peque Urban - Apartados</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
padding:15px;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

h1{
color:#111827;
}

.btn{
background:#2563eb;
color:white;
padding:12px 18px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.card{
background:white;
padding:15px;
border-radius:10px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
margin-bottom:20px;
}

input{
width:100%;
padding:10px;
margin-top:5px;
margin-bottom:10px;
border:1px solid #ddd;
border-radius:5px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:#111827;
color:white;
padding:10px;
}

td{
padding:8px;
border:1px solid #ddd;
text-align:center;
}

.estadoPendiente{
color:red;
font-weight:bold;
}

.estadoLiquidado{
color:green;
font-weight:bold;
}

.abono{
background:#16a34a;
color:white;
padding:8px;
border:none;
border-radius:5px;
cursor:pointer;
}

.eliminar{
background:#dc2626;
color:white;
padding:8px;
border:none;
border-radius:5px;
cursor:pointer;
}

.modal{

display:none;
position:fixed;
left:0;
top:0;
width:100%;
height:100%;
background:rgba(0,0,0,.5);

}

.modal-content{

background:white;
max-width:500px;
margin:40px auto;
padding:20px;
border-radius:10px;

}

@media(max-width:768px){

table{
display:block;
overflow-x:auto;
}

}

</style>
</head>

<body>

<div class="header">

<h1>📊 Peque Urban</h1>

<button class="btn" onclick="abrirModal()">
➕ Nuevo Recibo
</button>

</div>

<div class="card">

<input
type="text"
placeholder="Buscar cliente o teléfono..."
id="buscar"
onkeyup="filtrar()">

</div>

<table>

<thead>

<tr>
<th>Folio</th>
<th>Cliente</th>
<th>Teléfono</th>
<th>Artículo</th>
<th>Total</th>
<th>Abonado</th>
<th>Saldo</th>
<th>Estado</th>
<th>Acciones</th>
</tr>

</thead>

<tbody id="tabla">
</tbody>

</table>

<div class="modal" id="modal">

<div class="modal-content">

<h2>Nuevo Recibo</h2>

<label>Nombre</label>
<input type="text" id="cliente">

<label>Teléfono</label>
<input type="text" id="telefono">

<label>Artículo</label>
<input type="text" id="descripcion">

<label>Costo Total</label>
<input type="number" id="costo">

<label>Primer Abono</label>
<input type="number" id="abono">

<button class="btn" onclick="guardarRecibo()">
Guardar
</button>

<button
class="eliminar"
onclick="cerrarModal()">
Cancelar
</button>

</div>

</div>

<script>

let recibos =
JSON.parse(localStorage.getItem("recibos")) || [];

let consecutivo =
parseInt(localStorage.getItem("consecutivoPU")) || 1;

function abrirModal(){
document.getElementById("modal").style.display="block";
}

function cerrarModal(){
document.getElementById("modal").style.display="none";
}

function guardarRecibo(){

const costo =
parseFloat(document.getElementById("costo").value) || 0;

const abono =
parseFloat(document.getElementById("abono").value) || 0;

const saldo =
costo - abono;

const folio =
"PU-" +
String(consecutivo).padStart(5,"0");

const recibo={

folio:folio,
cliente:document.getElementById("cliente").value,
telefono:document.getElementById("telefono").value,
descripcion:document.getElementById("descripcion").value,
costo:costo,
totalAbonado:abono,
saldoPendiente:saldo

};

recibos.push(recibo);

localStorage.setItem(
"recibos",
JSON.stringify(recibos)
);

consecutivo++;

localStorage.setItem(
"consecutivoPU",
consecutivo
);

cerrarModal();

cargarTabla();

}

function cargarTabla(){

const tabla =
document.getElementById("tabla");

tabla.innerHTML="";

recibos.forEach((r,index)=>{

const estado =
r.saldoPendiente <=0
? "LIQUIDADO"
: "PENDIENTE";

tabla.innerHTML += `

<tr>

<td>${r.folio}</td>

<td>${r.cliente}</td>

<td>${r.telefono}</td>

<td>${r.descripcion}</td>

<td>$${r.costo.toFixed(2)}</td>

<td>$${r.totalAbonado.toFixed(2)}</td>

<td>$${r.saldoPendiente.toFixed(2)}</td>

<td class="${
estado=="LIQUIDADO"
? "estadoLiquidado"
: "estadoPendiente"
}">
${estado}
</td>

<td>

<button
class="abono"
onclick="abonar(${index})">
Abono
</button>

<button
class="eliminar"
onclick="eliminar(${index})">
Eliminar
</button>

</td>

</tr>

`;

});

}

function abonar(index){

let monto =
prompt("Monto del nuevo abono");

if(!monto) return;

monto = parseFloat(monto);

recibos[index].totalAbonado += monto;

recibos[index].saldoPendiente =
recibos[index].costo -
recibos[index].totalAbonado;

localStorage.setItem(
"recibos",
JSON.stringify(recibos)
);

cargarTabla();

}

function eliminar(index){

if(confirm("¿Eliminar recibo?")){

recibos.splice(index,1);

localStorage.setItem(
"recibos",
JSON.stringify(recibos)
);

cargarTabla();

}

}

function filtrar(){

let texto =
document
.getElementById("buscar")
.value
.toLowerCase();

document
.querySelectorAll("#tabla tr")
.forEach(fila=>{

fila.style.display =
fila.textContent
.toLowerCase()
.includes(texto)
? ""
: "none";

});

}

cargarTabla();

</script>

</body>
</html>
