<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Peque Urban</title><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><style>body{font-family:Arial;background:#f4f4f4;padding:15px}h1{margin:0}.top{display:flex;justify-content:space-between;align-items:center}.btn{background:#2563eb;color:#fff;border:none;padding:10px 14px;border-radius:6px}.card{background:#fff;padding:15px;border-radius:10px;margin:12px 0}table{width:100%;border-collapse:collapse;background:#fff}th,td{border:1px solid #ddd;padding:8px}th{background:#111827;color:#fff}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5)}.box{background:#fff;max-width:500px;margin:50px auto;padding:20px}.actions button{margin:2px}</style></head><body><div class="top"><h1>Peque Urban</h1><button class="btn" onclick="openModal()">+ Nuevo Recibo</button></div><div class="card"><input id="buscar" placeholder="Buscar cliente o teléfono"><button class="btn" onclick="filtrar()">Buscar</button></div><table><thead><tr><th>Folio</th><th>Cliente</th><th>Artículo</th><th>Saldo</th><th>Acciones</th></tr></thead><tbody id="tb"></tbody></table><div class="modal" id="m"><div class="box"><h3>Nuevo Recibo</h3><input id="cliente" placeholder="Cliente"><br><input id="telefono" placeholder="Teléfono"><br><input id="art" placeholder="Artículo"><br><input id="costo" type="number" placeholder="Costo"><br><input id="abono" type="number" placeholder="Abono inicial"><br><button class="btn" onclick="save()">Guardar</button></div></div><script>let r=JSON.parse(localStorage.getItem('recibos')||'[]');let c=parseInt(localStorage.getItem('cons')||'1');function openModal(){m.style.display='block'}function render(){tb.innerHTML='';r.forEach((x,i)=>tb.innerHTML+=`<tr><td>${x.folio}</td><td>${x.cliente}</td><td>${x.art}</td><td>$${x.saldo}</td><td class=actions><button onclick='ver(${i})'>👁</button><button onclick='wa(${i})'>📱</button><button onclick='pdf(${i})'>PDF</button></td></tr>`)}function save(){let o={folio:'PU-'+String(c).padStart(5,'0'),cliente:cliente.value,telefono:telefono.value,art:art.value,costo:+costo.value,abonado:+abono.value,saldo:(+costo.value)-(+abono.value)};r.push(o);localStorage.setItem('recibos',JSON.stringify(r));c++;localStorage.setItem('cons',c);m.style.display='none';render()}function filtrar(){let t=buscar.value.toLowerCase();[...tb.rows].forEach(v=>v.style.display=v.innerText.toLowerCase().includes(t)?'':'none')}function ver(i){alert(JSON.stringify(r[i],null,2))}function wa(i){let x=r[i];window.open('https://wa.me/52'+x.telefono+'?text='+encodeURIComponent('Recibo '+x.folio+' Saldo $'+x.saldo))}async function pdf(i){const {jsPDF}=window.jspdf;let x=r[i];let d=new jsPDF();d.text('PEQUE URBAN',20,20);d.text('Folio:'+x.folio,20,40);d.text('Cliente:'+x.cliente,20,50);d.text('Articulo:'+x.art,20,60);d.text('Saldo:$'+x.saldo,20,70);d.save(x.folio+'.pdf')}render();</script></body></html>
